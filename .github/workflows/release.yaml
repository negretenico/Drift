name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Use GITHUB_TOKEN for authentication to GitHub Packages
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Checkout the repository
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Setup Node.js and npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      # Configure Git for automated commits
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build all packages
      - name: Build packages
        run: npx turbo run build --filter='./packages/*'
      - name: Configure npm for GitHub Packages
        run: |
          echo "@drift:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ----------------------
      # Canary releases on develop
      # ----------------------
      - name: Publish Canary (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |


      # Comment on the commit with canary info
      - name: Comment Canary Release
        if: github.ref == 'refs/heads/develop'
        uses: actions/github-script@v8
        with:
          script: |
            const timestamp = Math.floor(Date.now() / 1000);
            const packages = ['@negretenico/lib', '@negretenico/react', '@negretenico/sw'];

            const body = `## 🚀 Canary Release Published

            **Install the latest canary:**
            \`\`\`bash
            npm install ${packages.map(p => `${p}@canary`).join(' ')}
            \`\`\`

            **Or specific version:**
            \`\`\`bash
            npm install ${packages.map(p => `${p}@0.1.0-canary.${timestamp}`).join(' ')}
            \`\`\`
            `;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

  

      # Create GitHub Releases for main
      - name: Create GitHub Releases (main)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%s)
          echo "Publishing canary packages with timestamp: $TIMESTAMP"

          for pkg in packages/*/package.json; do
            if [ -f "$pkg" ]; then
              DIR=$(dirname "$pkg")
              PACKAGE_NAME=$(node -p "require('./$pkg').name")
              CURRENT_VERSION=$(node -p "require('./$pkg').version")

              echo "Publishing ${PACKAGE_NAME}@${CURRENT_VERSION}"

              cd "$DIR"
              npm version "${CURRENT_VERSION}" --no-git-tag-version
              npm publish
              cd ../..
            fi
          done